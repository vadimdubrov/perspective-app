<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E3236">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Perspective">
<title>Perspective: A Visual Course</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:wght@600&display=swap">
<style>
body{margin:0;background:#ECEEF0}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active{transform:scale(.97)}
button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #E0B654;outline-offset:2px}
.app{min-height:100vh;display:flex;flex-direction:column;background:#ECEEF0;font-family:'IBM Plex Sans',sans-serif;color:#1B1F24;-webkit-tap-highlight-color:transparent}
.topbar{position:sticky;top:0;z-index:5;background:#2E3236;color:#EDE6D6;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.tb-in{max-width:720px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:'IBM Plex Serif',serif;font-size:20px;font-weight:600;margin:0}
.ttl{font-size:15px;font-weight:600;color:#CFC6AE}
.main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:12px}
.bnav{position:sticky;bottom:0;z-index:5;background:#fff;border-top:1px solid #D5D9DD;padding-bottom:env(safe-area-inset-bottom)}
.bn-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.bn{min-height:58px;min-width:0;padding:0 1px;border:0;background:none;color:#4A5560;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600}
.bn svg{width:24px;height:24px}
.bn.on{color:#1F4E79}
.bn.on svg{background:#DCE7F2;border-radius:12px;width:44px;padding:0 10px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#DDE2E7;border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;color:#1B1F24;font-size:15px;font-weight:600;padding:0 4px}
.seg button.on{background:#fff;color:#1F4E79;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.icons{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.icons::-webkit-scrollbar{display:none}
.ib{flex:none;min-width:72px;min-height:64px;border:1px solid #C5CBD1;border-radius:12px;background:#fff;color:#1F4E79;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;padding:6px 8px;white-space:nowrap}
.ib svg{width:26px;height:26px}
.exgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}
.exgrid .ib{min-width:0;white-space:normal;text-align:center;line-height:1.15;padding:6px 4px}
.ib.on{background:#1F4E79;color:#fff;border-color:#1F4E79}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.tl{min-height:60px;border:0;border-radius:12px;background:#fff;color:#1F4E79;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;padding:4px}
.tl svg{width:24px;height:24px}
.tl.on{background:#1F4E79;color:#fff}
.canvas{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.canvas svg,svg[role=img]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.status{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#fff;font-size:15px;line-height:1.45}
.dot{width:10px;height:10px;border-radius:5px;flex:none;margin-top:6px}
.small{font-size:15px;line-height:1.5;color:#4A5560;margin:0}
details.sheet{background:#fff;border-radius:12px}
details.sheet summary{min-height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:16px;list-style:none;cursor:pointer;-webkit-user-select:none;user-select:none}
details.sheet summary::-webkit-details-marker{display:none}
details.sheet summary svg{width:20px;height:20px;transition:transform .2s}
details.sheet[open] summary svg{transform:rotate(180deg)}
.sheet-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.sheet-body label,.sheet-body p{font-size:16px;line-height:1.5;margin:0}
.pill{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #1F4E79;background:#fff;color:#1F4E79;font-size:15px;font-weight:600}
.pill.on{background:#1F4E79;color:#fff}
.pill{flex:none;white-space:nowrap}
.pill:disabled{opacity:.45;cursor:default}
.lessons{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.card{background:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card h2,.card h3{margin:0;font-family:'IBM Plex Serif',serif;color:#1B1F24}
.card h2{font-size:22px}
.card p,.card li,.card label{font-size:16px;line-height:1.5;color:#1B1F24;margin:0}
.opt{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid #AEB5BC;background:#fff;color:#1B1F24;font-size:16px;text-align:left}
.opt.ok{border:2px solid #1D6B3A;background:#E3F2E8}
.opt.bad{border:2px solid #A63D2F;background:#FBE9E6}
.opt.dim{background:#F3F4F5;color:#4A5560}
.btn{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:#1F4E79;color:#fff;font-size:16px;font-weight:600}
input[type=range]{width:100%;min-height:44px;accent-color:#1F4E79}
@media (prefers-reduced-motion: reduce){button:active{transform:none}details.sheet summary svg{transition:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div class="app">
<header class="topbar"><div class="tb-in"><h1 class="brand">Perspective</h1><span class="ttl">{{secTitle}}</span></div></header>
<main class="main">
<sc-if value="{{isEx}}" hint-placeholder-val="{{ false }}">
<div class="icons exgrid" role="group" aria-label="Choose an exercise">
<sc-for list="{{exPills}}" as="m" hint-placeholder-count="6"><button type="button" class="{{m.cls}}" aria-pressed="{{m.on}}" onClick="{{m.pick}}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.icon}}"/></svg><span>{{m.label}}</span></button></sc-for>
</div>
</sc-if>


<sc-if value="{{isDraw}}" hint-placeholder-val="{{ false }}">
<div class="seg" role="group" aria-label="Perspective type">
<sc-for list="{{modePills}}" as="m" hint-placeholder-count="3"><button type="button" class="{{m.cls}}" aria-pressed="{{m.on}}" onClick="{{m.pick}}">{{m.label}}</button></sc-for>
</div>
<div class="icons" role="group" aria-label="Shape">
<sc-for list="{{shapePills}}" as="sh" hint-placeholder-count="7"><button type="button" class="{{sh.cls}}" aria-pressed="{{sh.on}}" onClick="{{sh.pick}}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{sh.icon}}"/></svg><span>{{sh.label}}</span></button></sc-for>
</div>
<div class="canvas">
<svg viewBox="{{vb}}" role="img" aria-label="A shape in perspective. Drag the dots, the box or the horizon line, or use the sliders under Adjust." onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" style="width:100%;height:auto;background:#F6F7F8;display:block;touch-action:none;cursor:grab">
<line x1="-3000" y1="{{eye}}" x2="3000" y2="{{eye}}" stroke="#1B1F24" stroke-width="1.5"/>
<path d="{{floorGrid}}" stroke="#C5CBD1" stroke-width="0.8" fill="none"/>
<path d="{{con}}" stroke="#B5832A" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
<g fill="#D9E4EE" stroke="#1F4E79" stroke-width="2" stroke-linejoin="round">
<polygon points="{{top}}"/><polygon points="{{bottom}}"/><polygon points="{{left}}"/><polygon points="{{right}}"/>
<polygon points="{{front}}"/>
</g>
<path d="{{shp.f3}}" fill="#AFC4DA"/><path d="{{shp.f2}}" fill="#C3D3E3"/><path d="{{shp.f1}}" fill="#D9E4EE"/><path d="{{shp.f0}}" fill="#EEF3F8"/>
<path d="{{shp.con}}" stroke="#8A8F94" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
<path d="{{shp.edges}}" stroke="#1F4E79" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
<path d="{{hiddenD}}" stroke="#1F4E79" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
<path d="{{hidCon}}" stroke="#B5832A" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
<path d="{{hidDots}}" fill="#fff" stroke="#1F4E79" stroke-width="1.5"/>
<circle cx="{{hx1}}" cy="{{eye}}" r="{{hr}}" fill="#1F4E79" stroke="#fff" stroke-width="2"/>
<circle cx="{{hx3}}" cy="{{hy3}}" r="{{r3}}" fill="#1F4E79" stroke="#fff" stroke-width="2"/>
<rect x="{{rsx}}" y="{{rsy}}" width="{{rsz}}" height="{{rsz}}" fill="#B5832A" stroke="#fff" stroke-width="1.5"/>
<circle cx="{{hx2}}" cy="{{eye}}" r="{{r2}}" fill="#1F4E79" stroke="#fff" stroke-width="2"/>
<text x="{{labX}}" y="{{labY}}" font-size="{{fs}}" font-family="IBM Plex Sans" fill="#1B1F24">Horizon line (eye level)</text>
<circle cx="{{dc.cx}}" cy="{{dc.cy}}" r="{{dc.r37}}" fill="none" stroke="#1D6B3A" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="{{dc.cx}}" cy="{{dc.cy}}" r="{{dc.r60}}" fill="none" stroke="#A63D2F" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="{{dc.pmark}}" fill="#1B1F24"/>
<path d="{{dc.dpts}}" fill="#7A5516"/>
</svg>
</div>
<div class="status" aria-live="polite"><span class="dot" style="background:{{dc.col}}"></span><div style="display:flex;flex-direction:column;gap:2px"><strong style="color:{{dc.col}};font-size:16px">{{dc.head}}</strong><span class="small">{{dc.detail}}</span><span class="small">{{dc.propMsg}}</span><sc-if value="{{hasDepthMsg}}" hint-placeholder-val="{{ false }}"><span class="small" style="color:#1F4E79;font-weight:600">{{depthMsg}}</span></sc-if></div></div>
<sc-if value="{{dc.anyFix}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-if value="{{dc.canFixView}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn" style="flex:1 1 140px" onClick="{{dc.fixView}}">Fix the view</button></sc-if>
<sc-if value="{{dc.canFix}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn" style="flex:1 1 140px" onClick="{{dc.fix}}">{{dc.fixLabel}}</button></sc-if>
</div>
</sc-if>
<div class="tools" role="toolbar" aria-label="View tools">
<sc-for list="{{toolBtns}}" as="tb" hint-placeholder-count="7"><button type="button" class="{{tb.cls}}" aria-pressed="{{tb.pressed}}" onClick="{{tb.act}}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{tb.icon}}"/></svg><span>{{tb.label}}</span></button></sc-for>
</div>
<sc-if value="{{dc.showCone}}" hint-placeholder-val="{{ false }}">
<p class="small">Green circle: clear vision, 37°. Red circle: the 60° limit of normal vision. Keep the shape inside the green circle for a natural look. Brown dots: the distance points (one point) or division points (two points) that measure true sizes.</p>
</sc-if>
<p class="small"><strong>{{shapeName}}.</strong> {{shapeTip}} Drag the dots, the shape or the horizon. Drag empty space to move around.</p>
<details class="sheet">
<summary><span>Adjust</span><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></summary>
<div class="sheet-body">
<label for="eye">Eye level: {{eye}}</label>
<input id="eye" type="range" min="30" max="230" value="{{eye}}" onChange="{{setEye}}">
<sc-if value="{{isOne}}" hint-placeholder-val="{{ true }}">
<label for="vx">Vanishing point position: {{vx}}</label>
<input id="vx" type="range" min="20" max="340" value="{{vx}}" onChange="{{setVx}}">
<label for="pd1">Your distance from the picture: {{dc.pd1}}</label>
<input id="pd1" type="range" min="60" max="3000" step="10" value="{{dc.pd1}}" onChange="{{dc.setPd}}">
</sc-if>
<sc-if value="{{isTwo}}" hint-placeholder-val="{{ false }}">
<label for="v1">Left vanishing point: {{v1}}</label>
<input id="v1" type="range" min="-1500" max="140" value="{{v1}}" onChange="{{setV1}}">
<label for="v2">Right vanishing point: {{v2}}</label>
<input id="v2" type="range" min="220" max="1860" value="{{v2}}" onChange="{{setV2}}">
</sc-if>
<sc-if value="{{isThree}}" hint-placeholder-val="{{ false }}">
<label for="v3">Third point height: {{v3}}</label>
<input id="v3" type="range" min="-1500" max="1700" value="{{v3}}" onChange="{{setV3}}">
</sc-if>
<p class="small">{{hint}}</p>
</div>
</details>
<details class="sheet">
<summary><span>Save and share</span><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></summary>
<div class="sheet-body">
<div style="display:flex;flex-wrap:wrap;gap:8px">
<button type="button" class="pill" onClick="{{exportSvg}}">Export SVG</button>
<button type="button" class="pill" onClick="{{saveFile}}">Save file</button>
</div>
<label for="fl">Load a saved file</label>
<input id="fl" type="file" accept=".json" onChange="{{loadFile}}" style="min-height:44px">
<label for="code">Scene code (copy it to share, paste it to load)</label>
<textarea id="code" rows="3" value="{{code}}" onChange="{{setCode}}" style="width:100%;font:16px/1.4 monospace;padding:8px;border:1px solid #AEB5BC;border-radius:8px"></textarea>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<button type="button" class="pill" onClick="{{makeCode}}">Make scene code</button>
<button type="button" class="pill" onClick="{{loadCode}}">Load scene code</button>
</div>
<p aria-live="polite">{{note}}</p>
</div>
</details>
</sc-if>

<sc-if value="{{isSc}}" hint-placeholder-val="{{ false }}">
<div class="card">
<h2>True sizes on all three axes</h2>
<p>{{sc.intro}}</p>
<div style="display:grid;grid-template-columns:minmax(0,1fr);gap:8px">
<div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))" role="group" aria-label="Box position">
<sc-for list="{{sc.modePills}}" as="mp" hint-placeholder-count="2"><button type="button" class="{{mp.cls}}" aria-pressed="{{mp.on}}" onClick="{{mp.pick}}">{{mp.label}}</button></sc-for>
</div>
<div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))" role="group" aria-label="Watch or practise">
<sc-for list="{{sc.playPills}}" as="pp" hint-placeholder-count="2"><button type="button" class="{{pp.cls}}" aria-pressed="{{pp.on}}" onClick="{{pp.pick}}">{{pp.label}}</button></sc-for>
</div>
</div>
<div class="lessons" role="group" aria-label="Steps">
<sc-for list="{{sc.stepPills}}" as="sp" hint-placeholder-count="5"><button type="button" class="{{sp.cls}}" aria-pressed="{{sp.on}}" onClick="{{sp.pick}}">{{sp.label}}</button></sc-for>
</div>
<svg viewBox="{{sc.vb}}" role="img" aria-label="{{sc.aria}}" onPointerDown="{{sc.down}}" onPointerMove="{{sc.move}}" onPointerUp="{{sc.up}}" onPointerCancel="{{sc.up}}" style="width:100%;height:auto;background:#F6F7F8;border-radius:6px;display:block;touch-action:none">
<rect x="0" y="{{sc.gy}}" width="360" height="{{sc.gh}}" fill="#ECE8DF"/>
<path d="{{sc.ghost}}" fill="none" stroke="#7E9BB5" stroke-width="1" stroke-dasharray="3 3"/>
<path d="{{sc.box}}" fill="#D9E4EE" stroke="#1F4E79" stroke-width="2" stroke-linejoin="round"/>
<path d="{{sc.boxTop}}" fill="#EEF3F8" stroke="#1F4E79" stroke-width="2" stroke-linejoin="round"/>
<path d="{{sc.hid}}" stroke="#1F4E79" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
<line x1="0" y1="{{sc.hy}}" x2="360" y2="{{sc.hy}}" stroke="#1B1F24" stroke-width="1.5"/>
<line x1="0" y1="{{sc.gy}}" x2="360" y2="{{sc.gy}}" stroke="#1B1F24" stroke-width="1.5"/>
<path d="{{sc.ruler}}" stroke="#1B1F24" stroke-width="1" fill="none"/>
<path d="{{sc.done}}" stroke="#8A8F94" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
<path d="{{sc.now}}" stroke="#B5832A" stroke-width="1.8" fill="none"/>
<path d="{{sc.marks}}" stroke="#A63D2F" stroke-width="4" stroke-linecap="round" fill="none"/>
<path d="{{sc.dots}}" fill="#1F4E79"/>
<path d="{{sc.corner}}" fill="#A63D2F"/>
<circle cx="{{sc.ringX}}" cy="{{sc.ringY}}" r="{{sc.ringR}}" fill="none" stroke="#A63D2F" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="{{sc.mlx}}" y="{{sc.mly}}" font-size="13" font-weight="600" text-anchor="{{sc.mla}}" font-family="IBM Plex Sans" fill="#A63D2F">{{sc.mlText}}</text>
<circle cx="180" cy="{{sc.pY}}" r="5" fill="#1B1F24"/>
<text x="180" y="{{sc.pLy}}" font-size="13" font-weight="600" text-anchor="middle" font-family="IBM Plex Sans" fill="#1B1F24">P</text>
<path d="{{sc.pts}}" fill="#7A5516"/>
<text x="{{sc.l1.x}}" y="{{sc.ply}}" font-size="13" font-weight="600" text-anchor="middle" font-family="IBM Plex Sans" fill="#7A5516">{{sc.l1.t}}</text>
<text x="{{sc.l2.x}}" y="{{sc.ply}}" font-size="13" font-weight="600" text-anchor="middle" font-family="IBM Plex Sans" fill="#7A5516">{{sc.l2.t}}</text>
<text x="{{sc.l3.x}}" y="{{sc.mpy}}" font-size="13" font-weight="600" text-anchor="middle" font-family="IBM Plex Sans" fill="#7A5516">{{sc.l3.t}}</text>
<text x="{{sc.l5.x}}" y="{{sc.l5.y}}" font-size="13" font-weight="600" text-anchor="middle" font-family="IBM Plex Sans" fill="#7A5516">{{sc.l5.t}}</text>
<text x="{{sc.l6.x}}" y="{{sc.l6.y}}" font-size="13" font-weight="600" text-anchor="middle" font-family="IBM Plex Sans" fill="#7A5516">{{sc.l6.t}}</text>
<text x="{{sc.l4.x}}" y="{{sc.mpy}}" font-size="13" font-weight="600" text-anchor="middle" font-family="IBM Plex Sans" fill="#7A5516">{{sc.l4.t}}</text>
<path d="{{sc.handles}}" fill="#B5832A" stroke="#fff" stroke-width="1.5"/>
<text x="354" y="{{sc.hly}}" font-size="12" text-anchor="end" font-family="IBM Plex Sans" fill="#1B1F24">Horizon</text>
<text x="6" y="{{sc.gly}}" font-size="12" font-family="IBM Plex Sans" fill="#1B1F24">Ground line: true sizes, ticks every 1 m</text>
</svg>
<p style="font-size:14px;color:#4A5560;display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0">
<span><span style="display:inline-block;width:12px;height:12px;background:#A63D2F;margin-right:4px;vertical-align:-1px"></span>True size</span>
<span><span style="display:inline-block;width:12px;height:12px;background:#B5832A;margin-right:4px;vertical-align:-1px"></span>This step</span>
<span><span style="display:inline-block;width:12px;height:12px;background:#1F4E79;border-radius:6px;margin-right:4px;vertical-align:-1px"></span>Points found</span>
</p>
<h3>{{sc.title}}</h3>
<p aria-live="polite"><strong>{{sc.instr}}</strong></p>
<sc-if value="{{sc.hasMsg}}" hint-placeholder-val="{{ false }}"><p aria-live="polite">{{sc.msg}}</p></sc-if>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<button type="button" class="pill" disabled="{{sc.isFirst}}" onClick="{{sc.prev}}">Previous</button>
<button type="button" class="btn" style="width:auto" disabled="{{sc.isLast}}" onClick="{{sc.next}}">Next step</button>
<sc-if value="{{sc.isWatch}}" hint-placeholder-val="{{ true }}"><button type="button" class="pill" onClick="{{sc.replay}}">Replay</button></sc-if>
<sc-if value="{{sc.isTry}}" hint-placeholder-val="{{ false }}"><button type="button" class="pill" onClick="{{sc.newTask}}">New box</button></sc-if>
<sc-if value="{{sc.isFinal}}" hint-placeholder-val="{{ false }}"><button type="button" class="pill" aria-pressed="{{sc.hidOn}}" onClick="{{sc.toggleHid}}">{{sc.hidLabel}}</button></sc-if>
<button type="button" class="pill" aria-pressed="{{sc.whyOn}}" onClick="{{sc.toggleWhy}}">{{sc.whyLabel}}</button>
</div>
<sc-if value="{{sc.whyOn}}" hint-placeholder-val="{{ false }}"><p style="background:#F3F4F5;border-radius:6px;padding:12px">{{sc.why}}</p></sc-if>
<p style="font-size:15px;color:#4A5560">{{sc.tip}}</p>
<sc-if value="{{sc.hasNote}}" hint-placeholder-val="{{ false }}"><p><strong>{{sc.check}}</strong></p></sc-if>
</div>
<details class="card">
<summary style="min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer">More settings</summary>
<sc-if value="{{sc.isOne}}" hint-placeholder-val="{{ true }}">
<label for="scw">Width: {{sc.wL}} m</label>
<input id="scw" type="range" min="0.5" max="4" step="0.1" value="{{sc.w}}" onChange="{{sc.setW}}">
<label for="scd">Depth: {{sc.dL}} m</label>
<input id="scd" type="range" min="0.5" max="6" step="0.1" value="{{sc.d}}" onChange="{{sc.setD}}">
<label for="scz">Distance behind the picture: {{sc.z0L}} m</label>

</div>

</sc-if>

<svg viewBox="0 0 360 200" role="img" aria-label="Top view: the eye, the glass and the object, with rays from the eye to the object’s corners." style="width:100%;height:auto;background:#F6F7F8;border-radius:6px;display:block">
